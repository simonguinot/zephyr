# SPDX-License-Identifier: Apache-2.0

description: |
  Everlight B1414 IC (and compatible) LED controller

  Driver bindings for daisy chains of B1414 IC (and compatible devices
  like SK6812) LED controllers.

  Each bit is described with a 1.2 us pulse

  0 bit: 300 ns high and 900 ns low.
  1 bit: 900 ns high and 300 ns low.

  For each timing a tolerance of +/- 80 ns is supported.

properties:
  chain-length:
    type: int
    required: true
    description: |
      The number of devices in the daisy-chain.
